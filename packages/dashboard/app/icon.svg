<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The app's mark is a hard-edged blue square (see SignIn.tsx: `h-3 w-3 bg-blue`),
    so the favicon is that same square, not a rounded app-store tile. The glyph is
    a square-cut C drawn as an open ring: at 16px a lettered "C" collapses into a
    blob, while a 5px stroke on a 32px grid stays two clean device pixels wide.
    One colour pair only — #0562ef / white — because the token file declares blue
    as the single accent, and the tile reads on both light and dark tab strips.
  -->
  <rect width="32" height="32" fill="#0562ef"/>
  <path d="M23 7H9v18h14" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/>
</svg>
